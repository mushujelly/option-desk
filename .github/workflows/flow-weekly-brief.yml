name: flow-weekly-brief

# Unified weekly brief: Discord flow mirror + optionbrief + email sources.
# Commits mirror/data/weekly_brief.md to the repo; the assistant reads it
# via API and presents it to the user.
permissions:
  contents: write

on:
  schedule:
    - cron: "0 12 * * 1"   # weekly, Monday 12:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "7"

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mirror/requirements.txt
      - name: Generate brief
        env:
          NEW_MDB_URI: ${{ secrets.NEW_MDB_URI }}
          MIRROR_DB: flow_mirror
        run: python3 mirror/flow_report.py --days "${{ inputs.days || '7' }}" --out mirror/data/weekly_brief.md
      - name: Commit brief
        run: |
          git config user.name "flow-brief-bot"
          git config user.email "flow-brief-bot@users.noreply.github.com"
          git add mirror/data/weekly_brief.md
          git diff --cached --quiet || git commit -m "weekly brief $(date -u +%F)"
          git push
