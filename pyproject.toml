[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "option-desk"
version = "0.1.0"
description = "Independent option data monitor — no strategy or trading"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3", "httpx>=0.28,<1", "pandas-market-calendars>=5,<6"]

[project.optional-dependencies]
live = ["schwab-py==1.5.1", "pymongo>=4.12,<5", "futu-api>=10.6,<11"]
test = ["pytest>=8,<10"]

[project.scripts]
option-desk = "option_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
